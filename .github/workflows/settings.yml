name: Settings validation
on:
  pull_request:
  push:
    branches: [main, feature/settings-cloudru]
  workflow_dispatch:
jobs:
  settings:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        shell: bash
        run: |
          node --check server/index.mjs
          node --check server/settings.mjs
          node --check web/app.js
      - name: Run tests
        run: npm test
      - name: Verify DPAPI round-trip on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --input-type=module -e "import {mkdtempSync,rmSync} from 'node:fs'; import {tmpdir} from 'node:os'; import {join} from 'node:path'; import {saveKey,readKey,deleteKey,hasKey} from './server/settings.mjs'; const d=mkdtempSync(join(tmpdir(),'dpapi-test-')); try { saveKey(d,'temporary-test-token-123456789'); if (!hasKey(d) || readKey(d)!=='temporary-test-token-123456789') process.exitCode=1; deleteKey(d); if(hasKey(d)) process.exitCode=1; } finally { rmSync(d,{recursive:true,force:true}); }"
