name: Windows launcher smoke
on:
  push:
    branches: [main, feature/settings-cloudru]
  pull_request:
  workflow_dispatch:
jobs:
  launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter '*.mjs' | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "Syntax error: $_" } }
      - name: Test health module
        run: node --test scripts/health-check.test.mjs
      - name: Verify application health on Windows
        shell: pwsh
        run: |
          $p = Start-Process node -ArgumentList 'server/index.mjs' -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:3000/health' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw 'Server health check failed' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Test BAT in Cyrillic and spaced directory
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Тест проект с пробелами'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item Amayune.bat -Destination $target
          Copy-Item scripts -Recurse -Destination $target
          Copy-Item server -Recurse -Destination $target
          Copy-Item web -Recurse -Destination $target
          Copy-Item package.json,package-lock.json,launcher.config.json -Destination $target
          $bat = Join-Path $target 'Amayune.bat'
          $process = Start-Process cmd.exe -ArgumentList ('/d /c ""' + $bat + '" --no-browser"') -PassThru -Wait -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "BAT returned $($process.ExitCode)" }
          $state = Get-Content (Join-Path $target '.runtime/server-state.json') -Raw | ConvertFrom-Json
          $response = Invoke-WebRequest ("http://127.0.0.1:" + $state.port + "/health") -UseBasicParsing
          if ($response.StatusCode -ne 200) { throw 'HTTP health-check failed' }
          taskkill /PID $state.pid /T /F | Out-Null
          Remove-Item (Join-Path $target '.runtime/server-state.json') -Force
